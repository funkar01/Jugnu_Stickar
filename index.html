<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugnu Sticker Creator</title>
    <!-- Dynamically pulling qrcode.js for client-side QR generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-color: #18181c;
            --accent-color: #ff6b35;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 25px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .canvas-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 0 auto 25px auto;
            background: #141417;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            max-width: 100%;
            height: auto;
            z-index: 2;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6c6c78;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .control-panel {
            background-color: var(--card-color);
            border: 2px solid #26262b;
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #a0a0ab;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #ffffff33;
            border-radius: 50%;
        }

        .expression-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .exp-btn {
            background-color: var(--card-color);
            border: 2px solid #26262b;
            border-radius: 16px;
            color: white;
            padding: 18px 0;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .exp-btn:hover {
            border-color: #555;
            transform: translateY(-2px);
        }

        .exp-btn.active {
            border-color: var(--accent-color);
            background-color: rgba(255, 107, 53, 0.12);
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.2);
        }

        .action-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-row {
            display: flex;
            gap: 12px;
        }

        /* FIXED: All action buttons share unified visual specs matching Download button */
        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 107, 53, 0.4);
        }

        /* Modal Structure for QR Code Container Popup */
        .qr-modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 15, 17, 0.9);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .qr-modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: #1c1c22;
            padding: 30px;
            border-radius: 24px;
            border: 2px solid #2d2d35;
            max-width: 300px;
            width: 80%;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .qr-modal.show .modal-content {
            transform: scale(1);
        }

        #qrcode {
            background: white;
            padding: 16px;
            border-radius: 16px;
            display: inline-block;
            margin: 20px 0;
        }

        #qrcode img {
            display: block;
            margin: 0 auto;
        }

        .close-btn {
            background: #2d2d35;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>XRCC_GG</h1>
        <div class="subtitle">Jugnu Spatial Companion</div>

        <div class="canvas-container">
            <canvas id="stickerCanvas" width="600" height="600"></canvas>
        </div>

        <div class="section-title">Customize Companion</div>
        <div class="control-panel">
            <div class="color-picker-wrapper">
                <input type="color" id="jugnuColor" value="#ff6b35" oninput="handleColorChange()">
                <span class="color-label">Jugnu Hue Color</span>
            </div>
        </div>

        <div class="section-title">Select Expression</div>
        <div class="expression-grid">
            <button class="exp-btn active" onclick="setExpression('classic', event)">^ _ ^</button>
            <button class="exp-btn" onclick="setExpression('happy', event)">♥ _ ♥</button>
            <button class="exp-btn" onclick="setExpression('wink', event)">O _ &lt;</button>
            <button class="exp-btn" onclick="setExpression('shocked', event)">O _ O</button>
        </div>

        <div class="action-stack">
            <button class="btn" onclick="downloadSticker()">
                ⬇️ Download Sticker
            </button>
            <div class="action-row">
                <button class="btn" onclick="shareSticker()">
                    📢 Share Sticker
                </button>
                <button class="btn" onclick="toggleQRModal(true)">
                    📱 Scan QR Link
                </button>
            </div>
        </div>
    </div>

    <div id="qrModal" class="qr-modal" onclick="toggleQRModal(false)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="margin-top: 0; font-weight: 800;">Scan to Open App!</h3>
            <p style="color: #a0a0ab; font-size: 0.85rem; margin-bottom: 0;">Share this code with friends to promote JugnuXR!</p>
            <div id="qrcode"></div>
            <button class="close-btn" onclick="toggleQRModal(false)">Close</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('stickerCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('jugnuColor');
        
        let currentExpression = 'classic';
        let targetHueShift = 0;
        
        let animationFrameId = null;
        let waveOffsetY = 0;
        let waveRotation = 0; 

        const jugnuBase = new Image();
        jugnuBase.src = './Jugnu_base.png';

        function updateHueFromHex(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            
            let min = Math.min(r, g, b);
            let max = Math.max(r, g, b);
            let hue = 0;
            if (max !== min) {
                if (max === r) hue = (g - b) / (max - min);
                else if (max === g) hue = 2 + (b - r) / (max - min);
                else hue = 4 + (r - g) / (max - min);
                hue = Math.round(hue * 60);
                if (hue < 0) hue += 360;
            }
            targetHueShift = (hue - 20 + 360) % 360;
        }

        function render(timestamp = 0) {
            waveOffsetY = Math.sin(timestamp / 300) * 5;
            waveRotation = Math.sin(timestamp / 600) * 0.04;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!jugnuBase.complete || jugnuBase.naturalWidth === 0) return;

            const imgWidth = jugnuBase.naturalWidth;
            const imgHeight = jugnuBase.naturalHeight;
            const aspectRatio = imgWidth / imgHeight;

            let renderWidth, renderHeight;
            if (aspectRatio > 1) {
                renderWidth = canvas.width;
                renderHeight = canvas.width / aspectRatio;
            } else {
                renderHeight = canvas.height;
                renderWidth = canvas.height * aspectRatio;
            }

            const xOffset = (canvas.width - renderWidth) / 2;
            const yOffset = (canvas.height - renderHeight) / 2;

            const cx = canvas.width / 2;
            const cy = yOffset + (renderHeight * 0.445); 

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(waveRotation);
            if (targetHueShift !== 0) {
                ctx.filter = `hue-rotate(${targetHueShift}deg) saturate(1.2)`;
            }
            ctx.drawImage(jugnuBase, -renderWidth / 2, -renderHeight * 0.445, renderWidth, renderHeight);
            ctx.restore();

            const activeFaceY = cy + waveOffsetY;
            drawExpressionLayer(ctx, cx, activeFaceY, currentExpression);

            animationFrameId = requestAnimationFrame(render);
        }

        function drawExpressionLayer(ctx, cx, cy, type) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.fillStyle = '#ffffff';

            const eyeY = cy - 10;      
            const mouthY = cy + 14;    
            const eyeOffset = 42; 
            const mouthWidth = 14; 

            if (type === 'classic') {
                ctx.beginPath();
                ctx.moveTo(cx - eyeOffset - 12, eyeY + 6);
                ctx.lineTo(cx - eyeOffset, eyeY - 6);
                ctx.lineTo(cx - eyeOffset + 12, eyeY + 6);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(cx + eyeOffset - 12, eyeY + 6);
                ctx.lineTo(cx + eyeOffset, eyeY - 6);
                ctx.lineTo(cx + eyeOffset + 12, eyeY + 6);
                ctx.stroke();
            } 
            else if (type === 'happy') {
                ctx.save();
                ctx.translate(cx - eyeOffset, eyeY);
                ctx.scale(0.85, 0.85); 
                ctx.beginPath();
                ctx.moveTo(0, 8);
                ctx.bezierCurveTo(0, 6, -14, -6, -14, -14);
                ctx.bezierCurveTo(-14, -24, -2, -24, 0, -12);
                ctx.bezierCurveTo(2, -24, 14, -24, 14, -14);
                ctx.bezierCurveTo(14, -6, 0, 6, 0, 8);
                ctx.fill();
                ctx.restore();
                
                ctx.save();
                ctx.translate(cx + eyeOffset, eyeY);
                ctx.scale(0.85, 0.85);
                ctx.beginPath();
                ctx.moveTo(0, 8);
                ctx.bezierCurveTo(0, 6, -14, -6, -14, -14);
                ctx.bezierCurveTo(-14, -24, -2, -24, 0, -12);
                ctx.bezierCurveTo(2, -24, 14, -24, 14, -14);
                ctx.bezierCurveTo(14, -6, 0, 6, 0, 8);
                ctx.fill();
                ctx.restore();
            } 
            else if (type === 'wink') {
                ctx.beginPath();
                ctx.arc(cx - eyeOffset, eyeY, 11, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(cx + eyeOffset + 10, eyeY - 10);
                ctx.lineTo(cx + eyeOffset - 4, eyeY);
                ctx.lineTo(cx + eyeOffset + 10, eyeY + 10);
                ctx.stroke();
            } 
            else if (type === 'shocked') {
                ctx.beginPath();
                ctx.arc(cx - eyeOffset, eyeY, 11, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(cx + eyeOffset, eyeY, 11, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = 'transparent'; 
            
            if (type === 'classic' || type === 'happy') {
                ctx.beginPath();
                ctx.moveTo(cx - mouthWidth, mouthY);
                ctx.quadraticCurveTo(cx, mouthY + 10, cx + mouthWidth, mouthY);
                ctx.stroke();
            } 
            else if (type === 'wink') {
                ctx.beginPath();
                ctx.moveTo(cx - mouthWidth, mouthY + 4);
                ctx.bezierCurveTo(cx - mouthWidth/2, mouthY + 10, cx + mouthWidth/2, mouthY - 4, cx + mouthWidth, mouthY + 2);
                ctx.stroke();
            } 
            else if (type === 'shocked') {
                ctx.beginPath();
                ctx.arc(cx, mouthY + 4, 8, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function setExpression(type, event) {
            currentExpression = type;
            document.querySelectorAll('.exp-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }

        function handleColorChange() {
            updateHueFromHex(colorPicker.value);
        }

        function generateStaticFrame() {
            cancelAnimationFrame(animationFrameId);
            let temporaryWaveOffset = waveOffsetY;
            let temporaryRotationOffset = waveRotation;
            waveOffsetY = 0;
            waveRotation = 0;
            render(0); 
            
            const dataUrl = canvas.toDataURL('image/png');
            
            waveOffsetY = temporaryWaveOffset;
            waveRotation = temporaryRotationOffset;
            animationFrameId = requestAnimationFrame(render);
            
            return dataUrl;
        }

        function downloadSticker() {
            try {
                const imgData = generateStaticFrame();
                const link = document.createElement('a');
                link.download = `jugnu-${currentExpression}-sticker.png`;
                link.href = imgData;
                link.click();
            } catch(e) {
                alert("Security Restriction: Open via a local server (like Live Server) or deploy online to download.");
            }
        }

        async function shareSticker() {
            try {
                const imgDataUrl = generateStaticFrame();
                const blob = await (await fetch(imgDataUrl)).blob();
                const file = new File([blob], `jugnu-${currentExpression}.png`, { type: blob.type });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'My Custom Jugnu Sticker!',
                        text: 'Check out my personalized spatial companion for JugnuXR at the XRCC 2026 hackathon! 🚀'
                    });
                } else {
                    await navigator.clipboard.writeText(window.location.href);
                    alert("App link copied to clipboard! Share it with your friends to promote JugnuXR! 📢");
                }
            } catch (err) {
                console.error("Share failed:", err);
            }
        }

        let qrGenerated = false;
        function toggleQRModal(show) {
            const modal = document.getElementById('qrModal');
            if (show) {
                modal.classList.add('show');
                if (!qrGenerated) {
                    new QRCode(document.getElementById("qrcode"), {
                        text: window.location.href, 
                        width: 180,
                        height: 180,
                        colorDark : "#0f0f11",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                    qrGenerated = true;
                }
            } else {
                modal.classList.remove('show');
            }
        }

        jugnuBase.onload = function() {
            animationFrameId = requestAnimationFrame(render);
        };
        jugnuBase.onerror = function() {
            ctx.fillStyle = '#ff6b35';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Error: Cannot find "Jugnu_base.png"', canvas.width / 2, canvas.height / 2);
        };
    </script>
</body>
</html>
